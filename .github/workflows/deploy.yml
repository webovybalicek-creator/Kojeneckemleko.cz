# Build Astro a nahrání na hosting přes FTP – automaticky při pushi do main, případně ručně v Actions.
#
# Potřebné GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER       – adresa FTP serveru (např. ftp.example.cz)
#   FTP_USERNAME     – FTP uživatel
#   FTP_PASSWORD     – FTP heslo
#   FTP_SERVER_DIR   – (volitelné) cílová složka s lomítkem na konci, např. "www/" – výchozí "./"
#   STATS_PASSWORD   – heslo ke stránce /navstevnost/
#   KOMENTARE_EMAIL  – (volitelné) e-mail pro upozornění na nový komentář ke schválení

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Konfigurace počítadla návštěvnosti
        env:
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
          KOMENTARE_EMAIL: ${{ secrets.KOMENTARE_EMAIL }}
        run: php -r 'file_put_contents("dist/api/config.php", "<?php\nreturn " . var_export(["stats_password" => (string) getenv("STATS_PASSWORD"), "notify_email" => (string) getenv("KOMENTARE_EMAIL")], true) . ";\n");'

      - name: Nahrání na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/data/**

      # Ohlášení změněných stránek Seznamu a Bingu (IndexNow). Stav otisků se drží v cache.
      - name: Obnovení stavu IndexNow
        uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: Uložení stavu IndexNow
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
